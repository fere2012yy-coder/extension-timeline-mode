<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="24" fill="#2563eb" />
  <!-- 主节点 -->
  <rect x="40" y="54" width="48" height="20" rx="6" fill="white" />
  <!-- 上质点串：圆点 + 虚线竖干 -->
  <line x1="64" y1="28" x2="64" y2="54" stroke="white" stroke-width="3" stroke-dasharray="4 3" />
  <circle cx="64" cy="24" r="6" fill="white" />
  <circle cx="64" cy="40" r="6" fill="white" />
  <!-- 下质点串 -->
  <line x1="64" y1="74" x2="64" y2="100" stroke="white" stroke-width="3" stroke-dasharray="4 3" />
  <circle cx="64" cy="88" r="6" fill="white" />
  <circle cx="64" cy="104" r="6" fill="white" />
  <!-- 右侧子项 -->
  <line x1="88" y1="64" x2="100" y2="64" stroke="white" stroke-width="3" />
  <rect x="100" y="56" width="14" height="16" rx="4" fill="white" fill-opacity="0.85" />
</svg>
